<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nabd</title>
    <script>
      // Runs before first paint so the page never flashes the wrong theme. The same rules live
      // in src/lib/theme/theme.ts, and a test checks the two agree.
      (function () {
        var preference = 'system';
        try {
          var stored = localStorage.getItem('nabd.theme');
          if (stored === 'light' || stored === 'dark') {
            preference = stored;
          }
        } catch (error) {
          // Storage can be blocked; fall back to the system setting.
        }
        var dark =
          preference === 'dark' ||
          (preference === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';

        // Language and direction, so Arabic never paints left to right first.
        var supported = ['en', 'ar'];
        var language = null;
        try {
          var storedLanguage = localStorage.getItem('nabd.language');
          if (supported.indexOf(storedLanguage) !== -1) {
            language = storedLanguage;
          }
        } catch (error) {
          // Storage can be blocked; fall back to the browser's languages.
        }
        var browser = navigator.languages || [];
        for (var index = 0; index < browser.length && !language; index += 1) {
          var primary = String(browser[index]).toLowerCase().split('-')[0];
          if (supported.indexOf(primary) !== -1) {
            language = primary;
          }
        }
        language = language || 'en';
        document.documentElement.lang = language;
        document.documentElement.dir = language === 'ar' ? 'rtl' : 'ltr';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
