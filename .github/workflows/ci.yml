name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Hooks can be skipped with --no-verify; this job cannot.
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Commit messages (Conventional Commits)
        if: github.event_name == 'pull_request'
        run: >
          pnpm exec commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Install the browser
        run: pnpm --filter @nabd/web exec playwright install --with-deps chromium

      # The root script goes through Turborepo, which builds the workspace packages first; the web
      # app cannot build without them. Playwright then builds and starts the server and the web app
      # itself (see playwright.config.ts). Running the web workspace's script directly, on a clean
      # checkout, fails because nothing is built yet.
      - name: Run the end-to-end tests
        run: pnpm test:e2e

      - name: Keep the report when a test fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  # `verify` already lints, tests, typechecks and builds the mobile app with everything else. This
  # job adds what only the mobile app needs: Expo's own health check, the typed-route declarations
  # (so a link to a route that does not exist fails the typecheck), and the Android export, which
  # also proves Metro resolves every shared package.
  mobile:
    name: Mobile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build the shared packages
        run: pnpm exec turbo run build --filter='@nabd/mobile^...'

      - name: Expo doctor
        run: pnpm --filter @nabd/mobile doctor

      - name: Generate the route types
        run: pnpm --filter @nabd/mobile typegen

      - name: Typecheck with the route types
        run: pnpm --filter @nabd/mobile typecheck

      - name: Export the Android bundle
        run: pnpm --filter @nabd/mobile build
        env:
          EXPO_PUBLIC_API_URL: https://example.invalid
